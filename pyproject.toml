[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "algony-mymcp"
dynamic = ["version"]
description = "Linux system control MCP server over Streamable HTTP with Bearer token auth"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "algony-tony", email = "txzhu1010@gmail.com"}]
keywords = ["mcp", "model-context-protocol", "linux", "remote-control", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
]
# v3: the server is the bundled Go binary (installed as `mymcp` from the
# platform wheel by scripts/assemble_wheel.py). The Python package is a
# recorder-only sidecar; a base install pulls nothing. Recorder features
# require the [recorder] extra.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-anyio",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-timeout",
    "pytest-randomly",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "mutmut",
    "build",
    "pip-tools>=7.4",
    "algony-mymcp[otlp]",
    # v3: base deps are now empty, so the test env must pull the recorder deps
    # (recorder unit tests + the compat suite's EventTailer) and the MCP client
    # the black-box compat suite talks to the Go server with.
    "algony-mymcp[recorder]",
    "mcp>=1.0.0",
]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
    "opentelemetry-instrumentation-fastapi>=0.62b0",
    "opentelemetry-instrumentation-asgi>=0.62b0",
    "opentelemetry-instrumentation-logging>=0.62b0",
]
# The recorder speaks HTTP directly via httpx (a core dependency); no SDKs
# needed. Extras kept (empty) so existing install commands don't break.
recorder-anthropic = []
recorder-openai    = []
recorder = [
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "pydantic-settings>=2.0",
    "python-json-logger>=2.0",
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-prometheus>=0.62b0",
]

[project.urls]
Homepage = "https://github.com/algony-tony/mymcp"
Repository = "https://github.com/algony-tony/mymcp"
Issues = "https://github.com/algony-tony/mymcp/issues"
Changelog = "https://github.com/algony-tony/mymcp/blob/master/CHANGELOG.md"

# The `mymcp` command is the Go binary, injected into the platform wheel's
# <name>-<ver>.data/scripts/ by scripts/assemble_wheel.py (which also strips any
# `mymcp = ...` console entry). Only the recorder sidecar is a Python entry.
[project.scripts]
mymcp-recorder = "mymcp.recorder.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mymcp.recorder" = ["templates/*.in"]

[tool.setuptools_scm]
write_to = "src/mymcp/_version.py"
fallback_version = "0.0.0+unknown"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E741", "SIM117", "SIM115", "E402"]
"tests/loadtest/**" = ["E741", "SIM115"]
"tests/pentest.py" = ["E741", "SIM115"]

[tool.mypy]
python_version = "3.11"
files = ["src/mymcp"]
strict = false
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--benchmark-disable -m 'not live'"
timeout = 30
timeout_method = "thread"
markers = [
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
    "live: tests that hit a real LLM API; require tests/live/.env.live",
]

[tool.mutmut]
# v3: the tool/server logic moved to the Go core (tested in go/). What remains
# mutation-worthy in Python is the recorder sidecar + config.
paths_to_mutate = [
    "src/mymcp/config.py",
    "src/mymcp/recorder/cursor.py",
    "src/mymcp/recorder/events.py",
    "src/mymcp/recorder/merge_cycle.py",
]
also_copy = ["src/", "scripts/"]
tests_dir = ["tests/"]
pytest_add_cli_args = ["--benchmark-disable"]
