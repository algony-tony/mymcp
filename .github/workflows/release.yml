name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  offline-bundle:
    runs-on: ubuntu-latest
    needs: [build, assemble-wheels]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: platform-wheel-amd64
          path: platform-dist
      - name: Build offline bundle
        run: |
          set -euo pipefail
          BUNDLE=mymcp-${{ needs.build.outputs.version }}-offline-bundle
          mkdir -p $BUNDLE/wheels
          # The platform wheel bundles the Go binary and has zero deps; just
          # vendor it (amd64 only — the offline installer targets x86_64 hosts).
          cp platform-dist/*.whl $BUNDLE/wheels/
          bash scripts/fetch-ripgrep.sh $BUNDLE
          cp scripts/install-offline.sh $BUNDLE/
          chmod +x $BUNDLE/install-offline.sh
          tar czf ${BUNDLE}.tar.gz $BUNDLE
          ls -la ${BUNDLE}.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: offline-bundle
          path: mymcp-*-offline-bundle.tar.gz

  # v3: publish ONLY the platform wheels (Go binary as `mymcp`). The pure wheel
  # and sdist from `build` are assembler inputs, never published — a pure wheel
  # has no `mymcp` binary and would be a broken fallback for pip on Linux.
  publish-pypi:
    runs-on: ubuntu-latest
    needs: assemble-wheels
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: platform-wheel-*
          path: platform-dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: platform-dist
          # Don't fail the job if the version is already on PyPI (e.g. it was
          # uploaded manually for the first release before Trusted Publisher
          # was wired up). Lets github-release proceed.
          skip-existing: true

  github-release:
    runs-on: ubuntu-latest
    needs: [assemble-wheels, offline-bundle, publish-pypi]
    if: always() && needs.assemble-wheels.result == 'success' && needs.offline-bundle.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: platform-wheel-*
          path: platform-dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: offline-bundle
          path: .
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            platform-dist/*.whl
            mymcp-*-offline-bundle.tar.gz
          generate_release_notes: true

  # Cross-compile the Go core into static linux/amd64 + linux/arm64 binaries and
  # upload them as run artifacts. assemble-wheels turns them into the published
  # platform wheels (the `mymcp` command IS this binary).
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum
      - name: cross-compile static binary
        working-directory: go
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          # Inject the tag (e.g. v3.0.0) so `mymcp version` / /health report the
          # real release instead of the "dev" default baked into version.go.
          go build -trimpath \
            -ldflags "-s -w -X github.com/algony-tony/mymcp/go/internal/version.Version=${GITHUB_REF_NAME}" \
            -o "mymcp-linux-${{ matrix.goarch }}" ./cmd/mymcp
          file "mymcp-linux-${{ matrix.goarch }}"
      - name: verify amd64 binary runs and reports the injected version
        if: matrix.goarch == 'amd64'
        run: |
          got=$(./go/mymcp-linux-amd64 version)
          echo "$got"
          if [ "$got" != "mymcp ${GITHUB_REF_NAME}" ]; then
            echo "::error::version not injected: got '$got', want 'mymcp ${GITHUB_REF_NAME}'"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: mymcp-linux-${{ matrix.goarch }}
          path: go/mymcp-linux-${{ matrix.goarch }}
          if-no-files-found: error

  # Assemble the v3 platform wheels (Go binary as `mymcp`) from the pure wheel +
  # the cross-compiled binaries. These are what publish-pypi + github-release
  # ship; the pure wheel/sdist from `build` are inputs only, never published.
  assemble-wheels:
    runs-on: ubuntu-latest
    needs: [build, build-binaries]
    strategy:
      matrix:
        include:
          - goarch: amd64
            plat: manylinux2014_x86_64
          - goarch: arm64
            plat: manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade wheel
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: mymcp-linux-${{ matrix.goarch }}
          path: bin
      - name: assemble platform wheel
        run: |
          chmod +x "bin/mymcp-linux-${{ matrix.goarch }}"
          python scripts/assemble_wheel.py dist/*.whl "bin/mymcp-linux-${{ matrix.goarch }}" "${{ matrix.plat }}" platform-dist/
          ls -la platform-dist/
      - uses: actions/upload-artifact@v7
        with:
          name: platform-wheel-${{ matrix.goarch }}
          path: platform-dist/*.whl
          if-no-files-found: error
