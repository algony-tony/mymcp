name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/mymcp

  go:
    runs-on: ubuntu-latest
    env:
      # Ratchet floor for whole-module Go statement coverage. Bump it up as
      # coverage improves; never let it silently regress.
      GO_COVER_MIN: "78"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l go/)"
      - name: vet
        run: cd go && go vet ./...
      - name: test with coverage
        working-directory: go
        run: |
          # -coverpkg=./... measures how much of ALL packages the whole suite
          # exercises (an honest module-wide number), not just each package's
          # self-coverage. Go has no native branch coverage, so this is the one
          # mainstream Go coverage metric: statement coverage.
          go test -covermode=atomic -coverpkg=./... -coverprofile=cover.out ./...
          COV=$(go tool cover -func=cover.out | awk '/^total:/{print substr($NF,1,length($NF)-1)}')
          echo "Go statement coverage: ${COV}%"
          awk -v c="$COV" -v m="$GO_COVER_MIN" 'BEGIN{exit !(c+0 >= m+0)}' \
            || { echo "::error::Go coverage ${COV}% is below the ${GO_COVER_MIN}% floor"; exit 1; }
      - name: Update Go coverage badge
        if: github.ref == 'refs/heads/master'
        working-directory: go
        run: |
          COV=$(go tool cover -func=cover.out | awk '/^total:/{print substr($NF,1,length($NF)-1)}')
          CINT=${COV%.*}
          if   [ "$CINT" -ge 90 ]; then COLOR=brightgreen
          elif [ "$CINT" -ge 80 ]; then COLOR=green
          elif [ "$CINT" -ge 70 ]; then COLOR=yellowgreen
          elif [ "$CINT" -ge 60 ]; then COLOR=yellow
          else COLOR=red; fi
          # Build the shields endpoint JSON, then JSON-string-escape it for the
          # gist "content" field. Values are fully controlled (no python/jq dep).
          BADGE="{\"schemaVersion\":1,\"label\":\"go coverage\",\"message\":\"${COV}%\",\"color\":\"${COLOR}\"}"
          ESCAPED=$(printf '%s' "$BADGE" | sed 's/\\/\\\\/g; s/"/\\"/g')
          BODY="{\"files\":{\"mymcp-go-coverage.json\":{\"content\":\"${ESCAPED}\"}}}"
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            -d "$BODY" \
            "https://api.github.com/gists/${{ secrets.GIST_ID }}"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=src/mymcp --cov-branch --cov-report=term-missing --cov-fail-under=85 --benchmark-disable

      - name: Update coverage badges
        if: github.ref == 'refs/heads/master' && matrix.python-version == '3.12'
        run: |
          LINE_COV=$(python -m pytest tests/ --cov=src/mymcp --cov-report=term -q --benchmark-disable 2>/dev/null | grep '^TOTAL' | awk '{print $NF}' | tr -d '%')
          BRANCH_COV=$(python -m pytest tests/ --cov=src/mymcp --cov-branch --cov-report=term -q --benchmark-disable 2>/dev/null | grep '^TOTAL' | awk '{print $NF}' | tr -d '%')

          if [ "$LINE_COV" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$LINE_COV" -ge 80 ]; then COLOR="green"
          elif [ "$LINE_COV" -ge 70 ]; then COLOR="yellowgreen"
          elif [ "$LINE_COV" -ge 60 ]; then COLOR="yellow"
          else COLOR="red"; fi
          LINE_JSON="{\"schemaVersion\":1,\"label\":\"recorder coverage\",\"message\":\"${LINE_COV}%\",\"color\":\"${COLOR}\"}"

          if [ "$BRANCH_COV" -ge 85 ]; then BCOLOR="brightgreen"
          elif [ "$BRANCH_COV" -ge 75 ]; then BCOLOR="green"
          elif [ "$BRANCH_COV" -ge 65 ]; then BCOLOR="yellowgreen"
          elif [ "$BRANCH_COV" -ge 55 ]; then BCOLOR="yellow"
          else BCOLOR="red"; fi
          BRANCH_JSON="{\"schemaVersion\":1,\"label\":\"recorder branch cov\",\"message\":\"${BRANCH_COV}%\",\"color\":\"${BCOLOR}\"}"

          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            -d "{\"files\":{\"mymcp-coverage.json\":{\"content\":$(echo "$LINE_JSON" | python -c 'import sys,json; print(json.dumps(sys.stdin.read()))')},\"mymcp-branch-coverage.json\":{\"content\":$(echo "$BRANCH_JSON" | python -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}}}" \
            "https://api.github.com/gists/${{ secrets.GIST_ID }}"

  # v3: there is no Python server anymore — the Go binary is the only server, so
  # the former compat-python job is gone. compat-go runs the black-box suite
  # against the Go server, using the vendored golden_tools.json schema snapshot.
  compat-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum
      - run: pip install -e ".[dev]" -c requirements-dev.txt
      - name: build and boot go server
        run: |
          cd go && go build -o /tmp/mymcp-go ./cmd/mymcp && cd ..
          mkdir -p /tmp/mymcp-compat /tmp/mymcp-compat-protected /tmp/mymcp-compat-audit
          cp tests/compat/ci-tokens.json /tmp/compat-tokens.json
          MYMCP_ADMIN_TOKEN=compat-admin MYMCP_TOKEN_FILE=/tmp/compat-tokens.json \
          MYMCP_PROTECTED_PATHS=/tmp/mymcp-compat-protected MYMCP_PORT=18770 \
          MYMCP_METRICS_TOKEN=compat-metrics \
          MYMCP_AUDIT_ENABLED=true MYMCP_AUDIT_LOG_DIR=/tmp/mymcp-compat-audit \
            /tmp/mymcp-go serve &
          for i in $(seq 20); do curl -sf http://127.0.0.1:18770/health && break; sleep 0.5; done
      - name: run compat suite
        run: |
          MYMCP_COMPAT_URL=http://127.0.0.1:18770 \
          MYMCP_COMPAT_RW_TOKEN=tok_compat_rw_0000000000000000 \
          MYMCP_COMPAT_RO_TOKEN=tok_compat_ro_0000000000000000 \
          MYMCP_COMPAT_METRICS_TOKEN=compat-metrics \
          MYMCP_COMPAT_AUDIT_DIR=/tmp/mymcp-compat-audit \
          MYMCP_COMPAT_ADMIN_TOKEN=compat-admin \
            pytest tests/compat/ -v --benchmark-disable

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Scan locked dev dependencies
        run: pip-audit --strict --requirement requirements-dev.txt

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          retention-days: 7

  mutation-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test
    concurrency:
      group: mutation-smoke-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c requirements-dev.txt

      - name: Restrict mutmut to smoke-test files
        env:
          MUTATION_PATHS_JSON: '["src/mymcp/config.py"]'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          marker = "[tool.mutmut]\n"
          path = Path("pyproject.toml")
          text = path.read_text()
          head, found, _ = text.partition(marker)
          if not found:
              raise SystemExit("Could not find [tool.mutmut] section in pyproject.toml")

          mutation_paths = json.loads(os.environ["MUTATION_PATHS_JSON"])
          rendered_paths = ",\n".join(f'    "{p}"' for p in mutation_paths)
          path.write_text(
              head
              + "[tool.mutmut]\n"
              + "paths_to_mutate = [\n"
              + rendered_paths
              + "\n]\n"
              + 'also_copy = ["src/"]\n'
              + 'tests_dir = ["tests/"]\n'
              + 'pytest_add_cli_args = ["--benchmark-disable"]\n'
          )
          PY

      - name: Run mutation smoke test
        run: |
          rm -rf mutants
          mutmut run --max-children 1
          mutmut export-cicd-stats
          mutmut results

  mutation-full:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: config
            paths_json: '["src/mymcp/config.py"]'
          - shard: recorder-cursor-events
            paths_json: '["src/mymcp/recorder/cursor.py", "src/mymcp/recorder/events.py"]'
          - shard: recorder-merge
            paths_json: '["src/mymcp/recorder/merge_cycle.py"]'
    concurrency:
      group: mutation-master-${{ matrix.shard }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c requirements-dev.txt

      - name: Restrict mutmut to shard
        env:
          MUTATION_PATHS_JSON: ${{ matrix.paths_json }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          marker = "[tool.mutmut]\n"
          path = Path("pyproject.toml")
          text = path.read_text()
          head, found, _ = text.partition(marker)
          if not found:
              raise SystemExit("Could not find [tool.mutmut] section in pyproject.toml")

          mutation_paths = json.loads(os.environ["MUTATION_PATHS_JSON"])
          rendered_paths = ",\n".join(f'    "{p}"' for p in mutation_paths)
          path.write_text(
              head
              + "[tool.mutmut]\n"
              + "paths_to_mutate = [\n"
              + rendered_paths
              + "\n]\n"
              + 'also_copy = ["src/"]\n'
              + 'tests_dir = ["tests/"]\n'
              + 'pytest_add_cli_args = ["--benchmark-disable"]\n'
          )
          PY

      - name: Run mutation testing for ${{ matrix.shard }}
        run: |
          rm -rf mutants
          mutmut run --max-children 1
          mutmut export-cicd-stats
          mutmut results | tee mutation-results-${{ matrix.shard }}.txt

      - name: Prepare shard stats artifact
        run: |
          cp mutants/mutmut-cicd-stats.json mutation-stats-${{ matrix.shard }}.json

      - name: Upload mutation shard artifact
        uses: actions/upload-artifact@v7
        with:
          name: mutation-stats-${{ matrix.shard }}
          path: |
            mutation-stats-${{ matrix.shard }}.json
            mutation-results-${{ matrix.shard }}.txt
          retention-days: 7

  mutation-aggregate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: mutation-full

    steps:
      - name: Download mutation shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-stats-*
          path: mutation-artifacts
          merge-multiple: true

      - name: Update mutation badge
        run: |
          SCORE=$(python - <<'PY'
          import json
          import sys
          from pathlib import Path

          stats_paths = sorted(Path("mutation-artifacts").glob("mutation-stats-*.json"))
          if not stats_paths:
              print("DEBUG: no mutation shard stats found", file=sys.stderr)
              print(0)
              raise SystemExit()

          totals = {
              "killed": 0,
              "survived": 0,
              "timeout": 0,
              "suspicious": 0,
              "total": 0,
              "no_tests": 0,
              "skipped": 0,
              "check_was_interrupted_by_user": 0,
              "segfault": 0,
          }
          for stats_path in stats_paths:
              with stats_path.open() as f:
                  shard = json.load(f)
              print(f"DEBUG: {stats_path.name}={shard}", file=sys.stderr)
              for key in totals:
                  totals[key] += shard.get(key, 0)

          print(f"DEBUG: aggregate={totals}", file=sys.stderr)
          denominator = totals["killed"] + totals["survived"] + totals["timeout"] + totals["suspicious"]
          print(totals["killed"] * 100 // denominator if denominator > 0 else 0)
          PY
          )

          if [ "$SCORE" -ge 80 ]; then COLOR="brightgreen"
          elif [ "$SCORE" -ge 70 ]; then COLOR="green"
          elif [ "$SCORE" -ge 60 ]; then COLOR="yellowgreen"
          elif [ "$SCORE" -ge 50 ]; then COLOR="yellow"
          else COLOR="red"; fi

          MUTATION_JSON="{\"schemaVersion\":1,\"label\":\"mutation score\",\"message\":\"${SCORE}%\",\"color\":\"${COLOR}\"}"
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            -d "{\"files\":{\"mymcp-mutation.json\":{\"content\":$(echo "$MUTATION_JSON" | python -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}}}" \
            "https://api.github.com/gists/${{ secrets.GIST_ID }}"
